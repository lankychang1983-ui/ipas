        // Start Countdown Timer
        function startTimer() {
            timerInterval = setInterval(() => {
                if (timerSeconds <= 0) {
                    clearInterval(timerInterval);
                    alert("考試時間結束！系統將自動交卷並結算成績。");
                    submitQuiz();
                    return;
                }
                timerSeconds--;
                const mins = Math.floor(timerSeconds / 60);
                const secs = timerSeconds % 60;
                document.getElementById('timer').textContent = 
                    `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            }, 1000);
        }

        // Render Questions HTML
        function renderQuestions() {
            const container = document.getElementById('questionsContainer');
            container.innerHTML = '';

            quizData.forEach((q, qIndex) => {

                qCard.id = `q-card-${qIndex}`;
                qCard.className = "bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4 transition-all";

                // Question Header
                let qHeader = `
                    <div class="flex items-start justify-between gap-3">
                        <div class="flex items-start space-x-3">
                            <span class="bg-indigo-100 text-indigo-700 font-bold px-2.5 py-1 rounded-lg text-sm shrink-0">

                            <h3 class="font-semibold text-slate-800 text-base leading-snug">
                                ${q.question}

                        <span class="text-xs font-semibold text-slate-400 bg-slate-100 px-2.5 py-1 rounded-full shrink-0">2分</span>
                    </div>
                `;

                // Options
                let optionsHtml = `<div class="grid grid-cols-1 md:grid-cols-2 gap-3 pt-2">`;
                q.options.forEach((opt, optIndex) => {
                    optionsHtml += `
                        <label id="opt-label-${qIndex}-${optIndex}" 
                               class="flex items-center space-x-3 p-3.5 rounded-xl border border-slate-200 hover:bg-slate-50 cursor-pointer transition text-sm text-slate-700">
                            <input type="radio" 
                                   name="question-${qIndex}" 
                                   value="${optIndex}" 
                                   onchange="selectAnswer(${qIndex}, ${optIndex})"
                                   class="w-4 h-4 text-indigo-600 focus:ring-indigo-500 border-slate-300">
                            <span>${opt}</span>
                        </label>
                    `;
                });
                optionsHtml += `</div>`;

                // Rationale Box (Hidden initially)
                let rationaleHtml = `
                    <div id="rationale-${qIndex}" class="hidden mt-4 p-4 rounded-xl bg-slate-50 border border-slate-200 text-xs text-slate-600 space-y-1">
                        <div class="font-bold text-slate-800 flex items-center space-x-1">
                            <i class="fa-solid fa-circle-info text-indigo-500"></i>
                            <span>題目試題解析：</span>
                        </div>
                        <p class="leading-relaxed">${q.rationale}</p>
                    </div>
                `;

                qCard.innerHTML = qHeader + optionsHtml + rationaleHtml;
                container.appendChild(qCard);
            });
        }

        // Render Right Sidebar Navigation Buttons Grid
        function renderQuestionGrid() {
            const grid = document.getElementById('questionGrid');
            grid.innerHTML = '';

            quizData.forEach((_, index) => {
                const btn = document.createElement('button');
                btn.id = `grid-btn-${index}`;
                btn.onclick = () => scrollToQuestion(index);
                btn.className = "w-full aspect-square rounded-lg font-semibold text-xs transition border flex items-center justify-center bg-slate-100 border-slate-200 text-slate-600 hover:bg-slate-200";
                btn.textContent = index + 1;
                grid.appendChild(btn);
            });
        }

        // Scroll to specific question
        function scrollToQuestion(index) {
            const el = document.getElementById(`q-card-${index}`);
            if (el) {
                el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        // Select option handler
        function selectAnswer(qIndex, optIndex) {
            if (isSubmitted) return; // Locked after submission

            userAnswers[qIndex] = optIndex;
            updateAnsweredCount();

            // Highlight Grid Button
            const gridBtn = document.getElementById(`grid-btn-${qIndex}`);
            if (gridBtn) {
                gridBtn.className = "w-full aspect-square rounded-lg font-semibold text-xs transition border flex items-center justify-center bg-indigo-600 border-indigo-600 text-white shadow-sm";
            }
        }

        // Update Answered Counters
        function updateAnsweredCount() {
            const count = userAnswers.filter(a => a !== null).length;
            document.getElementById('answeredCount').textContent = count;
            document.getElementById('answeredCountBottom').textContent = count;
        }

        // Confirm Submit Modal
        function confirmSubmit() {
            if (isSubmitted) return;

            const unanswered = userAnswers.filter(a => a === null).length;
            let msg = "確定要提交交卷並計算分數嗎？";
            if (unanswered > 0) {
                msg = `您還有 ${unanswered} 題尚未回答，確定要提交嗎？`;
            }

            if (confirm(msg)) {
                submitQuiz();
            }
        }

        // Main Submit & Grading Function
        function submitQuiz() {
            if (isSubmitted) return;
            isSubmitted = true;
            clearInterval(timerInterval);

            let correctCount = 0;

            quizData.forEach((q, qIndex) => {
                const userAns = userAnswers[qIndex];
                const qCard = document.getElementById(`q-card-${qIndex}`);
                const gridBtn = document.getElementById(`grid-btn-${qIndex}`);
                const rationaleBox = document.getElementById(`rationale-${qIndex}`);

                // Show rationale
                if (rationaleBox) rationaleBox.classList.remove('hidden');

                // Check answer correctness
                const isCorrect = (userAns === q.answer);

                if (isCorrect) {
                    correctCount++;
                    if (qCard) qCard.classList.add('border-emerald-300', 'bg-emerald-50/20');
                    if (gridBtn) {
                        gridBtn.className = "w-full aspect-square rounded-lg font-semibold text-xs transition border flex items-center justify-center bg-emerald-500 border-emerald-500 text-white shadow-sm";
                    }
                } else {
                    if (qCard) qCard.classList.add('border-rose-300', 'bg-rose-50/20');
                    if (gridBtn) {
                        gridBtn.className = "w-full aspect-square rounded-lg font-semibold text-xs transition border flex items-center justify-center bg-rose-500 border-rose-500 text-white shadow-sm";
                    }
                }

                // Highlight Labels
                q.options.forEach((_, optIndex) => {
                    const label = document.getElementById(`opt-label-${qIndex}-${optIndex}`);
                    if (!label) return;

                    // Disable inputs
                    const input = label.querySelector('input');
                    if (input) input.disabled = true;

                    if (optIndex === q.answer) {
                        // Correct Option (Green)
                        label.className = "flex items-center space-x-3 p-3.5 rounded-xl border-2 border-emerald-500 bg-emerald-50 text-emerald-900 font-medium text-sm";
                    } else if (optIndex === userAns && !isCorrect) {
                        // Wrong Selected Option (Red)
                        label.className = "flex items-center space-x-3 p-3.5 rounded-xl border-2 border-rose-400 bg-rose-50 text-rose-900 text-sm";
                    } else {
                        // Normal Option
                        label.className = "flex items-center space-x-3 p-3.5 rounded-xl border border-slate-200 opacity-60 text-sm text-slate-500";
                    }
                });
            });

            // Calculate Score (2 points per question)
            const finalScore = correctCount * 2;

            // Render Score Result Card
            const resultCard = document.getElementById('resultCard');
            const scoreDisplay = document.getElementById('scoreDisplay');
            const passBadge = document.getElementById('passBadge');
            const resultSummary = document.getElementById('resultSummary');

            resultCard.classList.remove('hidden');
            scoreDisplay.textContent = finalScore;

            if (finalScore >= 60) {
                passBadge.className = "inline-block px-4 py-1.5 rounded-full text-sm font-bold bg-emerald-100 text-emerald-700 border border-emerald-200";
                passBadge.textContent = "及格 (PASS)";
                resultSummary.textContent = `恭喜通過測驗！答對 ${correctCount} / 50 題。`;
            } else {
                passBadge.className = "inline-block px-4 py-1.5 rounded-full text-sm font-bold bg-rose-100 text-rose-700 border border-rose-200";
                passBadge.textContent = "未及格 (FAILED)";
                resultSummary.textContent = `請再接再厲！答對 ${correctCount} / 50 題，未達 60 分標準。`;
            }

            // Scroll Top to View Score Card
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Reset Quiz
        function resetQuiz() {
            if (confirm("確定要重頭開始測驗嗎？答案將全部清空。")) {
                location.reload();
            }
        }
    </script>
</body>
</html>
